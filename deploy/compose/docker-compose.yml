services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    image: smart15-backend:local
    container_name: smart15-backend
    restart: unless-stopped
    ports:
      - "${SMART15_BACKEND_PORT:-8000}:8000"
    volumes:
      - ../../backend/temp_export:/app/temp_export
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4); response.close()"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - smart15-network

  geolibre:
    build:
      context: ../..
      dockerfile: deploy/docker/geolibre.Dockerfile
    image: smart15-geolibre:local
    container_name: smart15-geolibre
    restart: unless-stopped
    ports:
      - "${SMART15_WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/health"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - smart15-network

networks:
  smart15-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.250.0/24
          gateway: 172.29.250.1